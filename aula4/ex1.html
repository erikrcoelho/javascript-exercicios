<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criando o seu primeiro script</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
        }
        div.apresentacao{
            background-color: aqua;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="apresentacao">
    <h1>Praticando js</h1>
    
</div>
<script>
//você pode escrever o codigo dessa maneira tambem: alert('') sem o window
    window.alert('Bem vindo!')     
    window.confirm('Praticando js') 
    window.prompt('Você gosta de js?')
</script>


</body>
</html>
