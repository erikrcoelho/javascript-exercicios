<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if else</title>
</head>
<body>
    <p>Saudação baseado na hora do dia</p>
    <p id="demo"></p>
    
    <script>
        var hora = new Date().getHours()
        var saudacao

        if(hora < 18){
            saudacao = 'Bom dia!'
        }else{
            saudacao = 'Boa noite'
        }
        document.getElementById('demo').innerHTML = saudacao
    </script>
</body>
</html>
