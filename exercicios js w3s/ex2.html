<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if else</title>
</head>
<body>
    <p id="demo">Good afternoon</p>
    <script>
        if(new Date().getHours() < 12){
            document.getElementById('demo').innerHTML ='Good day'
        }
    </script>
</body>
</html>
