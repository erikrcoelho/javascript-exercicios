<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do veiculo: <input type="number" name="txtvel" id="txtvel">
    <input type="button" value="Verificar" onclick="calcular()">
   <div id="res">

   </div>
    <script>
        
        function calcular(){
            var txtv = document.getElementById('txtvel')
            var res = document.getElementById('res')
            var vel = Number(txtv.value)
            res.innerHTML = `<p>Sua velocidade atual é de <strong> ${vel} </strong> Km/h</p>`
            if(vel > 60){
                res.innerHTML += `Você esta MULTADO por excesso de velocidade`
            }else{
                res.innerHTML += `<p>Dirija com cuidado!</p>`
            }
                
            
        }
    </script>
</body>
</html>
