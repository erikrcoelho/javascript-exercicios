<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamento de dados</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
        }
        div.apresentacao{
            background-color: aqua;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="apresentacao">
    <h1>Praticando js</h1>
    
</div>
<script>
   var n1 = Number(window.prompt('Digite um número: '))
   var n2 = Number(window.prompt('Digite outro número: '))
   var s = n1 + n2
   window.alert(`A soma entre ${n1} e ${n2} sera: ${s}`)
</script>


</body>
</html>
