<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamento de dados</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bolder;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é seu nome?')
        document.write(`Olá ${nome}! Seu nome tem ${nome.length} letras.`)
        document.write(` Seu nome em maiusculas é  ${nome.toUpperCase()} <br/>`) 
        document.write(`Seu nome em minusculas é ${nome.toLowerCase()}`) //Nao esqueca do parentes () que é chamada pro metodo
    </script>
</body>
</html>
