<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }
        h1{
            text-align: center;
        }
        div{
           text-align: center;
        }
        input{
            border-radius: 10px;
            padding: 10px;
            border-style: solid;
            border-color: black;
        }
        div#res{
            padding: 10px;
        }
        
    </style>
</head>
<body>
    <h1>Somando valores</h1>
    <div>
        <input type="number" name="txtn1" id="txtn1">
        <input type="number" name="txtn2" id="txtn2">
        <input type="button" value="Somar" id="botao">
    </div>
    <div id="res">Resultado</div>
    <script>
        var botao = document.getElementById('botao')
        botao.addEventListener('click', somar)
        function somar() {
            var texto1 = document.getElementById('txtn1')
            var texto2 = document.getElementById('txtn2')
            var res = document.getElementById('res')
            var n1 = Number(texto1.value)
            var n2 = Number(texto2.value)
            var s = n1 + n2
            res.innerHTML = `A soma dos valores sera ${s}`
        }
    </script>
</body>
</html>
